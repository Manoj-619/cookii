version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: cookii-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: cookii
    volumes:
      - mongo_data:/data/db
    networks:
      - cookii-net
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cookii-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - cookii-net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: cookii-backend
    restart: unless-stopped
    ports:
      - '4000:4000'
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cookii-net
    volumes:
      - ./apps/backend:/app/apps/backend
      - ./packages:/app/packages
      - /app/apps/backend/node_modules

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: cookii-admin
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - cookii-net
    volumes:
      - ./apps/admin:/app/apps/admin
      - /app/apps/admin/node_modules

volumes:
  mongo_data:
  redis_data:

networks:
  cookii-net:
    driver: bridge
